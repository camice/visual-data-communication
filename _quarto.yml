# Website configuration for Visual Data Communication
# Based on the cambiotraining Quarto course template

project:
  type: book
  output-dir: _site
  render:
    - index.md
    - setup.md
    - design-process.qmd
    - materials/*.qmd
    - reference/*.qmd
    - references.qmd

format:
  courseformat-html:
    css: assets/custom.css
    fig-align: center

filters:
  - courseformat

bibliography: references.bib

execute:
  freeze: auto
  warning: false
  message: false

knitr:
  opts_chunk:
    fig.width: 7
    fig.height: 4.2
    dpi: 150
    out.width: "100%"

book:
  title: "Visual Data Communication"
  subtitle: "Designing figures with purpose in R and Python"
  bread-crumbs: false
  search:
    location: sidebar
  favicon: "_extensions/cambiotraining/courseformat/img/university-of-cambridge-favicon.ico"
  page-navigation: true
  page-footer:
    center: |
      Licensed [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/)
      ![](https://creativecommons.org/images/deed/cc_icon_black_x2.png){width=25px}
      Cambridge Centre for Research Informatics Training
  navbar:
    pinned: true
    logo: "_extensions/cambiotraining/courseformat/img/university_crest_reversed.png"
    right:
      - icon: github
        href: https://github.com/cambiotraining/
        aria-label: Cambridge Centre for Research Informatics Training GitHub
    title: "Visual Data Communication"
  chapters:
    - part: "Welcome"
      chapters:
        - index.md
        - setup.md
        - design-process.qmd
    - part: "**Foundations**"
      chapters:
        - materials/building-a-plot.qmd
    - part: "**Explore your data**"
      chapters:
        - materials/distributions.qmd
        - materials/relationships.qmd
        - materials/change-over-time.qmd
    - part: "**Design for attention**"
      chapters:
        - materials/ranking.qmd
        - materials/colour.qmd
        - materials/labels-and-annotation.qmd
    - part: "**Finish your figures**"
      chapters:
        - materials/scales-and-axes.qmd
        - materials/multi-panel-and-export.qmd
        - materials/makeover-challenge.qmd
    - part: "Reference"
      chapters:
        - reference/checklist.qmd
        - reference/recipes.qmd
        - reference/gallery.qmd
        - references.qmd
